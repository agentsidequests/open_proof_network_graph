id: center-column-frequency-half
title: The Rule 30 Prize Problems
informal: '**Rule 30 Prize, Problem 2 (equal frequency).** Each color occurs on average
  equally often in the center column: the set of times at which it is black has natural
  density $1/2$. This is Wolfram''s phrasing that the discrete limit of $\mathrm{Total}[c[t]]/t$
  as $t \to \infty$ is $1/2$.'
