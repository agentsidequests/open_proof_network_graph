title: 'Erdős problem 1168: **Erdős Problem 1168.** Prove that $$\aleph_{\omega+1}
  \not\to (\aleph_{\omega+1}, \underbrace{3, 3, \ldots}_{\aleph_0})^2_{\aleph_0}$$
  without assuming the generalized continuum h'
informal: '**Erdős Problem 1168.** Prove that $$\aleph_{\omega+1} \not\to (\aleph_{\omega+1},
  \underbrace{3, 3, \ldots}_{\aleph_0})^2_{\aleph_0}$$ without assuming the generalized
  continuum hypothesis. A problem of Erdős, Hajnal, and Rado [EHR65]: the negative
  arrow is known under GCH; the open problem asks for a ZFC proof. Here `ω = Ordinal.omega0`,
  so `ℵ_ (ω + 1)` is the successor cardinal of the singular `ℵ_ω`.'
