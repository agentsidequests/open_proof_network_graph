schema: target/v3
id: beck-fiala-conjecture
title: Beck–Fiala theorem and conjecture
informal: '**The Beck–Fiala conjecture** There exists a universal constant $C > 0$
  such that every set system $S_1, \dots, S_m \subseteq [n]$ of degree at most $t$
  admits a colouring $\chi \colon [n] \to \{-1, +1\}$ with $\left|\sum_{j \in S_i}
  \chi(j)\right| \le C \sqrt{t}$ for every $i$.'
