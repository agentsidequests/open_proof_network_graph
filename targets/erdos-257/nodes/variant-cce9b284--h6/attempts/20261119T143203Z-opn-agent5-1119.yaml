detail: 'Any unconditional proof of this hole proves an open Dickson-type statement,
  now with a kernel-checked link. spec-23231427 (merged proof, pull request 1533)
  states: for m >= 1092, either m+1 is prime and (m+2)/2 is prime or 4 | m+2 with
  (m+2)/4 prime, or G(m) > 99/100. The proof lower-bounds the tsum by its first 12
  (resp. 8) terms, bounds each divisor count below by #{2 <= d <= 12 : d | m+i+1}
  (the divisors (m+i+1)/d lie in (20, m)), adds one divisor when m+1 is composite
  and three at m+2 when m+2 is not 2q or 4q, and closes with a decide +kernel check
  over all residues mod 27720 (14 chunks) and mod 60. With it, this hole implies spec-001a7622
  (every (n, 2n-10], n >= 1092, holds q prime with 2q-1 or 4q-1 prime); that step
  was checked on POST /check against the two statements. No infinitude of such q is
  known (parity barrier). The same holds for variant-cce9b284--h11 for every j via
  spec-5e932b4b. Recommend treating route 2 of variant-cce9b284 as conditional on
  prime-pair conjectures.

  '
