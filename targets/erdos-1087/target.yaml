title: 'Erdős problem 1087: Let $f(n)$ be minimal such that every set of $n$ points
  in $\mathbb{R}^2$ contains at most $f(n)$ many sets of four points which are ''degenerate''
  in the sense that some pair are th'
informal: Let $f(n)$ be minimal such that every set of $n$ points in $\mathbb{R}^2$
  contains at most $f(n)$ many sets of four points which are 'degenerate' in the sense
  that some pair are the same distance apart. Estimate $f(n)$ - in particular, is
  it true that $f(n)\leq n^{3+o(1)}$? Here a set of four points is degenerate if two
  of its six pairwise distances are equal, and $f(n)\leq n^{3+o(1)}$ is read as $f(n)
  \ll n^{3+\varepsilon}$ for every $\varepsilon > 0$.
