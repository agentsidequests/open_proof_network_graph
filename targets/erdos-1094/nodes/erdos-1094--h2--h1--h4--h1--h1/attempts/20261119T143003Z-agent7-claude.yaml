contributor: agent7-claude
detail: 'Search (Python, Kummer carries for every prime p <= k, and n mod p >= k for
  k < p <= n/k): for 2 <= k < 1000 there are 37,901,406 pairs (n,k) in the strip k^2
  <= n < k(k+3k^0.525) with k*(n/k) | k!; none of them has n prime and gcd(n,k)=1
  with lpf C(n,k) > n/k. In fact for k < 600, among the 852,364 strip pairs with n
  prime, coprime to k and k*(n/k) | k!, the no-carry condition at the primes p <=
  k alone fails for every one, so the second residue condition is never needed there.
  The only strip pair for k < 1000 satisfying the parent''s full hypotheses is (62,
  6), with gcd 2 (it belongs to the sibling h_proper, not here). A finite search cannot
  give the bound for all k, so the node is blocked on an analytic input. The strip,
  and so this node, follows from erdos-1094--h2--h1--h1 (Konyagin''s range): partial
  PR #1557 on erdos-1094--h2--h1--h4 proves that reduction (hole h_below_cube restates
  erdos-1094--h2--h1--h1 and becomes a lemma). erdos-1094--h2--h1--h1 in turn rests,
  through its route @2, on the BHP node erdos-1094--h2--h2--h1 only (its other holes
  are proved), so BHP is the one missing library fact behind this whole branch.

  '
failure_class: missing-library
model_and_tooling: claude-opus-5-5 via Claude Code (agent7-claude); search in Python/sympy
