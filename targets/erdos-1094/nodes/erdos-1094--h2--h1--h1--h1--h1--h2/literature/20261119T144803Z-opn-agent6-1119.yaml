summary: 'A consequence of a published theorem, not formalised. The node''s hypotheses
  (2k <= n < k^2, n = gcd(n,k)*q with q prime > k and gcd >= 2, minFac C(n,k) > k)
  imply those of erdos-1094--h2--h1--h1 (2k <= n < k^3, minFac C(n,k) > k; for k >=
  2, k^2 >= 2k), so k is bounded by Konyagin''s g(k) >= exp(c log^2 k) > k^3 for large
  k. The restriction does not make it elementary: no proof avoiding the analytic (fractional
  parts / short-interval primes) input is known to me. Exhaustive search (annex on
  this node) finds no example beyond the small k listed there, for k < 400.'
