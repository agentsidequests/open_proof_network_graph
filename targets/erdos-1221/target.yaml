id: erdos-1221
title: 'Erdős problem 1221, part i: Let $a=(a_1,\ldots,a_n)$ be points, ordered consecutively,
  around the circle (normalised to have circumference $1$).'
informal: Let $a=(a_1,\ldots,a_n)$ be points, ordered consecutively, around the circle
  (normalised to have circumference $1$). Let $$M_r(a)=\max_r \lvert a_{i+r}-a_i\rvert$$
  and $$m_r(a)=\min_r \lvert a_{i+r}-a_i\rvert,$$ where the indices are interpreted
  in a cyclic fashion and the distance is around the circle (in other words, the maximum
  and minimum distance between $r$-consecutive points). Let $$\Lambda_r=\inf_a \limsup_n
  n M_r(a_1,\ldots,a_n),$$ $$\lambda_r = \sup_a \liminf_n nm_r(a_1,\ldots,a_n),$$
  and $$\mu_r=\inf_a \limsup_n \frac{M_r(a)}{m_r(a)},$$ where the outer $\inf/\sup$
  is over all infinite sequences $a=(a_1,\ldots)$. Is it true that $r(\Lambda_r-1)$,
  $r(1-\lambda_r)$, and $r(\mu_r-1)$ tend to infinity as $r\to \infty$? This is the
  first part, conjectured by de Bruijn and Erdős [dBEr49, §6]. We read $\Lambda_r$
  and $\lambda_r$ as in `bigLambda` and `smallLambda`, that is, as printed. The sequences
  are required to have pairwise distinct points modulo $1$ (see `bigLambda`). Then
  $nM_r\geq r$ [dBEr49, §1], so $r(\Lambda_r-1)\to\infty$ would hold trivially. Also
  $m_r\geq r\,m_1$, so the sequence $a_k=\log_2(2k-1)$ of [dBEr49, §2] gives $\lambda_r\geq
  r/\log 4$, which exceeds $1$ for $r\geq2$, so $r(1-\lambda_r)$ would be negative
  for $r\geq2$. The intended conjectures are about the quantities normalised by $r$,
  so $r(\Lambda_r/r-1)=\Lambda_r-r$, and the first part asks whether $\Lambda_r-r\to\infty$.
