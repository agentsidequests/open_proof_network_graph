title: 'Erdős problem 1113: **Erdős Problem 1113.** Do there exist Sierpiński numbers
  that possess no finite covering set of primes?'
informal: '**Erdős Problem 1113.** Do there exist Sierpiński numbers that possess
  no finite covering set of primes? Erdős and Graham [ErGr80] conjectured that the
  answer is yes. A negative answer would imply that there are infinitely many Fermat
  primes.'
