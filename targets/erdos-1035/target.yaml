id: erdos-1035
title: 'Erdős problem 1035: Is there a constant $c > 0$ such that every graph on $2^n$
  vertices with minimum degree $> (1-c) \cdot 2^n$ contains the $n$-dimensional hypercube
  $Q_n$?'
informal: Is there a constant $c > 0$ such that every graph on $2^n$ vertices with
  minimum degree $> (1-c) \cdot 2^n$ contains the $n$-dimensional hypercube $Q_n$?
  This is Erdős's question [Er93, p. 345]. See also [576] for the extremal number
  of edges that guarantee a $Q_n$.
