references:
- title: D. Singmaster, How often does an integer occur as a binomial coefficient?,
    Amer. Math. Monthly 78 (1971) 385-386
  url: https://doi.org/10.2307/2316907
  note: States the conjecture that the multiplicity N(a) is bounded and proves N(a)
    = O(log a)
- title: K. Matomaki, M. Radziwill, X. Shao, T. Tao, J. Teravainen, Singmaster's conjecture
    in the interior of Pascal's triangle, Q. J. Math. 73 (2022)
  url: https://arxiv.org/abs/2106.03335
  note: Proves the bound in the region k >= exp((log n)^(2/3+e)); the bound for all
    a remains open
summary: 'This node is Singmaster''s conjecture (1971) in the half-triangle row form:
  a uniform bound on the number of rows holding a value. It is open; the best unconditional
  bounds on N(a) grow with a (Singmaster O(log a), Kane 2007 O(log a loglog log a
  / (log log a)^3)), and Matomaki-Radziwill-Shao-Tao-Teravainen 2022 settle only the
  interior of Pascal''s triangle.'
