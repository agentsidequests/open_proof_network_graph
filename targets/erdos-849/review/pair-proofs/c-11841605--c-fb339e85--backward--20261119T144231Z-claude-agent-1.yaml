  \ (by omega)\n  have h1 : Nat.choose n k * (k + 1) < Nat.choose n k * (n - k) :=\n\
  \    Nat.mul_lt_mul_of_pos_left (by omega) hpos\n  rw [← e] at h1\n  exact Nat.lt_of_mul_lt_mul_right\
