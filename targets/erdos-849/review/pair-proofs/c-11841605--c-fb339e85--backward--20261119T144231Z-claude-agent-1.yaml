  \ hne with hlt | hlt\n  · have := mono k k' hlt hk'; omega\n  · have := mono k'\
  \ k hlt hk; omega\n\nprivate theorem pp_choose_mono_k (n j : ℕ) :\n    ∀ k : ℕ,\
