  \  induction k, hjk using Nat.le_induction with\n  | base => exact le_rfl\n  | succ\
  \ k hjk ih =>\n    exact le_trans (ih (by omega)) (Nat.choose_le_succ_of_lt_half_left\
  \ (by omega))\n\nprivate theorem pp_pairs_finite (a : ℕ) :\n    {p : ℕ × ℕ | 1 ≤\
