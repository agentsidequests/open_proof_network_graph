  \ k' ≤ n)\n    (h : Nat.choose n k = Nat.choose n k') : k = k' := by\n  have mono\
  \ : ∀ j m : ℕ, j < m → 2 * m ≤ n → Nat.choose n j < Nat.choose n m := by\n    intro\
  \ j m hjm hm\n    induction m, hjm using Nat.le_induction with\n    | base => exact\
  \ pp_choose_strict_k n j hm\n    | succ m hjm ih =>\n      exact lt_trans (ih (by\
