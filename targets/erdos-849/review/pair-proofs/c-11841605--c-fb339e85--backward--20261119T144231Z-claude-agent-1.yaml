  \ theorem, lemma, def or abbrev declarations only)\nprivate theorem pp_choose_strict_k\
  \ (n k : ℕ) (hk : 2 * (k + 1) ≤ n) :\n    Nat.choose n k < Nat.choose n (k + 1)\
  \ := by\n  have e : Nat.choose n (k + 1) * (k + 1) = Nat.choose n k * (n - k) :=\
