schema: target/v3
id: babai-seress-conjecture
title: Babai–Seress Conjectures on the Diameter of Finite Groups
informal: '**Babai–Seress Conjecture (Conjecture 1.7)**: There exists an absolute
  constant $C$ such that every finite simple non-abelian group $G$ satisfies $$\operatorname{diam}(G)
  \leq (\log |G|)^C.$$ *Reference:* [L. Babai and Á. Seress, *On the diameter of permutation
  groups*, European Journal of Combinatorics 13 (1992), Conjecture 1.7](https://doi.org/10.1016/S0195-6698(05)80029-0)'
